<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel | Lucas Faustino Advocacia</title>
    <meta name="robots" content="noindex" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { navy: "#0A1F44", gold: "#C59B56" },
            fontFamily: {
              serif: ['"Playfair Display"', "serif"],
              sans: ['"Inter"', "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-gray-50 text-navy font-sans min-h-screen">
    <!-- Login -->
    <section
      id="login"
      class="min-h-screen flex items-center justify-center p-4"
    >
      <form
        id="loginForm"
        class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm space-y-4 border-t-4 border-gold"
      >
        <h1 class="font-serif text-2xl font-bold text-center">Área Restrita</h1>
        <p class="text-sm text-gray-500 text-center">
          Acesso exclusivo do escritório
        </p>
        <input
          id="email"
          type="email"
          required
          placeholder="E-mail"
          class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-gold outline-none text-sm"
        />
        <input
          id="senha"
          type="password"
          required
          placeholder="Senha"
          class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-gold outline-none text-sm"
        />
        <p id="loginErro" class="hidden text-sm text-red-600"></p>
        <button
          type="submit"
          id="btnLogin"
          class="w-full bg-navy hover:bg-gold text-white font-bold py-3 rounded-lg transition disabled:opacity-60"
        >
          Entrar
        </button>
        <a
          href="inde1.html"
          class="block text-center text-xs text-gray-400 hover:text-gold"
          >← Voltar ao cadastro</a
        >
      </form>
    </section>

    <!-- Painel -->
    <section id="painel" class="hidden max-w-6xl mx-auto p-4 md:p-8">
      <header class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div>
          <h1 class="font-serif text-2xl font-bold">Clientes Cadastrados</h1>
          <p class="text-sm text-gray-500">
            <span id="total">0</span> cadastro(s)
          </p>
        </div>
        <div class="flex gap-2">
          <button
            id="csv"
            class="px-4 py-2 rounded-lg bg-white border border-gray-200 hover:border-gold text-sm"
          >
            <i class="fa-solid fa-file-csv mr-1"></i> Exportar CSV
          </button>
          <button
            id="sair"
            class="px-4 py-2 rounded-lg bg-navy text-white hover:bg-gold text-sm"
          >
            <i class="fa-solid fa-right-from-bracket mr-1"></i> Sair
          </button>
        </div>
      </header>
      <input
        id="busca"
        placeholder="Buscar por nome, telefone ou endereço..."
        class="w-full mb-4 px-4 py-3 rounded-lg border border-gray-200 focus:border-gold outline-none text-sm bg-white"
      />
      <div class="bg-white rounded-xl shadow overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="bg-navy text-white text-xs uppercase tracking-wider">
            <tr>
              <th class="p-3">Data</th>
              <th class="p-3">Nome</th>
              <th class="p-3">Telefone</th>
              <th class="p-3">Endereço</th>
              <th class="p-3"></th>
            </tr>
          </thead>
          <tbody id="lista" class="divide-y divide-gray-100"></tbody>
        </table>
        <p id="vazio" class="hidden p-6 text-center text-gray-400">
          Nenhum cadastro encontrado.
        </p>
      </div>
    </section>

    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
      (function () {
        "use strict";

        /* ====== MESMA CONFIG do index.html ====== */
        const firebaseConfig = {
          apiKey: "AIzaSyA-C1fhpSDs-mclzyCrfnhq17Y6Yol1P7I",
          authDomain: "lucas-advogado.firebaseapp.com",
          databaseURL: "https://lucas-advogado-default-rtdb.firebaseio.com",
          projectId: "lucas-advogado",
          storageBucket: "lucas-advogado.firebasestorage.app",
          messagingSenderId: "921214898505",
          appId: "1:921214898505:web:8669bda60e29f38e710a98",
        };
        /* ========================================= */

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const $ = (id) => document.getElementById(id);
        let clientes = [];
        let unsub = null;

        const esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );

        const fmt = (c) =>
          c.criadoEm && typeof c.criadoEm.toDate === "function"
            ? c.criadoEm.toDate().toLocaleString("pt-BR")
            : "—";

        /* ---------- Login ---------- */
        $("loginForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const erroEl = $("loginErro");
          const btn = $("btnLogin");
          erroEl.classList.add("hidden");
          btn.disabled = true;
          btn.textContent = "Entrando...";
          try {
            await auth.signInWithEmailAndPassword(
              $("email").value.trim(),
              $("senha").value,
            );
          } catch (err) {
            console.error("Login erro:", err.code);
            let msg = "E-mail ou senha inválidos.";
            if (err.code === "auth/too-many-requests")
              msg = "Muitas tentativas. Aguarde alguns minutos.";
            else if (err.code === "auth/network-request-failed")
              msg = "Sem conexão com a internet.";
            else if (err.code === "auth/invalid-email")
              msg = "E-mail em formato inválido.";
            erroEl.textContent = msg;
            erroEl.classList.remove("hidden");
          } finally {
            btn.disabled = false;
            btn.textContent = "Entrar";
          }
        });

        $("sair").onclick = () => auth.signOut();

        /* ---------- Observa estado de login ---------- */
        auth.onAuthStateChanged((user) => {
          $("login").classList.toggle("hidden", !!user);
          $("painel").classList.toggle("hidden", !user);

          if (unsub) {
            unsub();
            unsub = null;
          }
          if (!user) return;

          unsub = db
            .collection("clientes")
            .orderBy("criadoEm", "desc")
            .onSnapshot(
              (snap) => {
                clientes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
                render();
              },
              (err) => {
                console.error("Firestore onSnapshot erro:", err);
                alert(
                  "Sem permissão para ler os dados. Verifique as regras do Firestore.\nCódigo: " +
                    err.code,
                );
              },
            );
        });

        /* ---------- Render ---------- */
        function render() {
          const t = $("busca").value.toLowerCase().trim();
          const lista = clientes.filter((c) =>
            [c.nome, c.telefone, c.endereco]
              .join(" ")
              .toLowerCase()
              .includes(t),
          );
          $("total").textContent = clientes.length;
          $("vazio").classList.toggle("hidden", lista.length > 0);

          if (!lista.length) {
            $("lista").innerHTML = "";
            return;
          }

          $("lista").innerHTML = lista
            .map((c) => {
              const digits = String(c.telefone || "").replace(/\D/g, "");
              const wa =
                digits.length >= 10 ? `https://wa.me/55${digits}` : "#";
              return `
              <tr class="hover:bg-gray-50 align-top">
                <td class="p-3 whitespace-nowrap text-gray-500">${esc(fmt(c))}</td>
                <td class="p-3 font-medium">${esc(c.nome)}</td>
                <td class="p-3 whitespace-nowrap">
                  <a class="text-green-600 hover:underline" target="_blank" rel="noopener" href="${wa}">
                    <i class="fa-brands fa-whatsapp"></i> ${esc(c.telefone)}
                  </a>
                </td>
                <td class="p-3 text-gray-600 min-w-[220px]">${esc(c.endereco)}</td>
                <td class="p-3">
                  <button data-id="${c.id}" class="del text-red-400 hover:text-red-600">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </td>
              </tr>`;
            })
            .join("");
        }

        $("busca").addEventListener("input", render);

        /* ---------- Excluir ---------- */
        $("lista").addEventListener("click", async (e) => {
          const b = e.target.closest(".del");
          if (!b) return;
          if (!confirm("Excluir este cadastro?")) return;
          try {
            await db.collection("clientes").doc(b.dataset.id).delete();
          } catch (err) {
            console.error("Erro ao excluir:", err);
            alert(
              "Não foi possível excluir. Verifique as regras do Firestore.",
            );
          }
        });

        /* ---------- Exportar CSV ---------- */
        $("csv").onclick = () => {
          const q = (s) => `"${String(s ?? "").replace(/"/g, '""')}"`;
          const linhas = [
            ["Data", "Nome", "Telefone", "Endereço"].map(q).join(";"),
          ].concat(
            clientes.map((c) =>
              [fmt(c), c.nome, c.telefone, c.endereco].map(q).join(";"),
            ),
          );
          const blob = new Blob(["\ufeff" + linhas.join("\n")], {
            type: "text/csv;charset=utf-8",
          });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "clientes.csv";
          a.click();
          URL.revokeObjectURL(a.href);
        };
      })();
    </script>
  </body>
</html>
